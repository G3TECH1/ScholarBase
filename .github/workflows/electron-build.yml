name: Electron Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && pip install pyinstaller

      - name: Build Python DB daemon (Windows)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --console --distpath ./python_dist --name db_service model/inMemoryDB/database_server.py

      - name: Build app (electron-builder)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScholarBase-Windows-Installer
          path: dist/*.exe          pyinstaller --onefile model/inMemoryDB/database_server.py --distpath dist_py --name database_server
          mkdir -p build/python-daemon
          mv dist_py/* build/python-daemon/

      - name: Build Python DB daemon (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pyinstaller --onefile Nodejs/model/inMemoryDB/database_server.py --distpath dist_py --name database_server
          New-Item -ItemType Directory -Path build\python-daemon -Force | Out-Null
          Copy-Item -Path dist_py\* -Destination build\python-daemon -Recurse -Force

      - name: Ensure built daemon is executable
        if: matrix.os != 'windows-latest'
        run: chmod -R +x build/python-daemon || true

      - name: Build app (electron-builder)
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: dist/
